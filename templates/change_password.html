{% extends "base.html" %}
{% from "_macros.html" import icon, csrf with context %}
{% block title %}Change password{% endblock %}
{% block content %}
<form method="post" class="card narrow-card">
  <div class="card-icon">{{ icon('key') }}</div>
  <h1>Change password</h1>
  <p class="muted">Signed in as {{ current_user.email }}</p>
  {{ csrf() }}
  <label class="field"><span>Current password</span>
    <input type="password" name="current" required autofocus autocomplete="current-password">
  </label>
  <label class="field"><span>New password</span>
    <input type="password" name="new" required minlength="8" autocomplete="new-password">
    <small>At least 8 characters, with a letter and a number.</small>
  </label>
  <label class="field"><span>Confirm new password</span>
    <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
  </label>
  <div class="form-actions">
    <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
    <button class="btn btn-primary">{{ icon('check') }}Change password</button>
  </div>
</form>
{% endblock %}
